# XcodeGen spec: `xcodegen generate` (in this directory) writes
# UAVResolver.xcodeproj, which is not committed. CI does this on macOS; see
# .github/workflows/ios-build.yml.
name: UAVResolver
options:
  bundleIdPrefix: top.cnsc
  deploymentTarget:
    iOS: "16.0"
targets:
  UAVResolver:
    type: application
    platform: iOS
    sources: [UAVResolver]
    scheme: {}
    info:
      path: UAVResolver/Info.plist
      properties:
        CFBundleDisplayName: UAV
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The resolver is usually plain http on a LAN address or bare IP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 连接局域网里的解析服务
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.cnsc.uavresolver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Built unsigned; Sideloadly / AltStore sign it with the user's Apple ID.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
